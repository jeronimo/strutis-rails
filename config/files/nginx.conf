server {
  listen 80;
  server_name _;

  location = /files-health {
    return 200 "ok";
  }

  location ~ "^/[a-z0-9]{20,50}$" {
    limit_except GET HEAD { deny all; }
    rewrite ^ /strutis-rails$uri break;
    proxy_pass http://10.100.11.11:9000;
    proxy_http_version 1.1;
    proxy_set_header Host 10.100.11.11:9000;
    proxy_set_header X-Forwarded-For "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    return 404;
  }
}
