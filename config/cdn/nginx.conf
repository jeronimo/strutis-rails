server {
  listen 80;
  server_name _;

  location = /cdn-health {
    return 200 "ok";
  }

  location ~ ^/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}/.+ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://10.100.11.11:9000/strutis-rails/;
    proxy_http_version 1.1;
    proxy_set_header Host 10.100.11.11:9000;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    return 404;
  }
}
